name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies (zero-trust)
        run: npm ci --ignore-scripts

      - name: Rebuild native WebTorrent dependencies
        # Force bash: on Windows the default shell is pwsh, where `2>/dev/null`
        # is parsed as Out-File to `D:\dev\null` and fails the step.
        shell: bash
        run: |
          npm rebuild utp-native bufferutil utf-8-validate 2>/dev/null || true
          npm rebuild node-datachannel fs-native-extensions 2>/dev/null || true
        env:
          npm_config_ignore_scripts: 'false'

      # See ci.yml note: ip patched via overrides, audit-level=critical until webtorrent upstream fix
      - name: Dependency security audit
        run: npm audit --audit-level=critical

      - name: Type check + Test + Build
        run: npm run typecheck && npm test && npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true

      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  binaries:
    needs: npm-publish
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (zero-trust)
        run: npm ci --ignore-scripts

      - name: Rebuild native WebTorrent dependencies
        # Force bash: on Windows the default shell is pwsh, where `2>/dev/null`
        # is parsed as Out-File to `D:\dev\null` and fails the step.
        shell: bash
        run: |
          npm rebuild utp-native bufferutil utf-8-validate 2>/dev/null || true
          npm rebuild node-datachannel fs-native-extensions 2>/dev/null || true
        env:
          npm_config_ignore_scripts: 'false'

      - name: Build
        run: npm run build

      - name: Package standalone binary
        run: echo "SEA packaging for ${{ matrix.target }} lands in v0.6"
