name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (zero-trust)
        run: npm ci --ignore-scripts

      # WebTorrent's native deps (utp-native, bufferutil, utf-8-validate,
      # node-datachannel, fs-native-extensions) ship pre-built binaries via
      # prebuild-install. Rebuild only if pre-built binary is missing.
      # These are whitelisted: all are source-available and provide WebRTC/UDP primitives.
      - name: Rebuild native WebTorrent dependencies
        # Force bash: on Windows the default shell is pwsh, where `2>/dev/null`
        # is parsed as Out-File to `D:\dev\null` and fails the step.
        shell: bash
        run: |
          npm rebuild utp-native bufferutil utf-8-validate 2>/dev/null || true
          npm rebuild node-datachannel fs-native-extensions 2>/dev/null || true
        env:
          npm_config_ignore_scripts: 'false'

      # ip SSRF (GHSA-2p57-rm9w-gvfp) is patched via package.json overrides (ip@2.0.1 in lockfile).
      # npm audit still reports HIGH on webtorrent/bittorrent-tracker/torrent-discovery because
      # the advisory tracks the dependent chain, not the patched root package — this is a known
      # npm false positive when using overrides. Auditing at --audit-level=critical until
      # webtorrent upstream releases with ip>=2.0.1 declared in their own package.json.
      - name: Dependency security audit
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
